<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #FAF8F5; color: #1D1D1B;
    font-family: "DM Sans", "Segoe UI", Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 68px 76px;
  }
  .serif { font-family: "Playfair Display", Georgia, "Times New Roman", serif; }
  .top { display: flex; align-items: center; gap: 20px; }
  .lockup { font-size: 44px; letter-spacing: -0.5px; }
  .lockup .dot { color: #C0A090; }
  h1 { font-size: 58px; line-height: 1.1; font-weight: 600; max-width: 900px; letter-spacing: -0.5px; }
  .lede { margin-top: 20px; font-size: 23px; line-height: 1.45; color: rgba(29,29,27,0.7); max-width: 820px; }
  .bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .worlds { display: flex; gap: 10px; }
  .worlds span { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(29,29,27,0.12); }
  .meta { text-align: right; font-size: 20px; color: rgba(29,29,27,0.62); letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="top">
    <svg width="56" height="56" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="24" cy="24" r="18" fill="#FFFFFF" stroke="#1D1D1B" stroke-width="1.5"/>
      <path d="M29 18.5C27.5 16.5 25.2 15.5 22.8 15.5C19.2 15.5 16.8 17.8 16.8 21C16.8 26.2 31.2 24.5 31.2 30.2C31.2 33.6 28.2 36.5 24 36.5C20.2 36.5 17.2 34.5 15.8 32" stroke="#1D1D1B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="31.5" cy="16.5" r="1.75" fill="#909888"/>
      <circle cx="16.5" cy="31.5" r="1.75" fill="#C0A090"/>
    </svg>
    <span class="serif lockup">Styld<span class="dot">.</span></span>
  </div>

  <div>
    <h1 class="serif">Book beauty with the same trust<br>you give a person you already know.</h1>
    <p class="lede">A trust-first beauty marketplace built in Nairobi. Discover a provider, build one beauty
      plan across six personal worlds, and agree the details on a single record.</p>
  </div>

  <div class="bottom">
    <div class="worlds" aria-hidden="true">
      <span style="background:#FAF5F2"></span>
      <span style="background:#FDF1F3"></span>
      <span style="background:#EEF4EC"></span>
      <span style="background:#F3F1FA"></span>
      <span style="background:#FBF0E9"></span>
      <span style="background:#F6F1EC"></span>
    </div>
    <p class="meta">Private beta, invite only<br>wearestyld.com</p>
  </div>
</body>
</html>
